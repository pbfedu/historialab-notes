<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HistòriaLab Notes - Portal d'Apunts Gamificats</title>

  <!-- Google Fonts: Fredoka & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome 6.5.1 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- html2pdf.js per a exportació PDF directa -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- CARREGA DINÀMICA DE TEMES EN ARXIUS JS SEPARATS -->
<script src="tema1.js"></script>
<script src="tema2.js"></script>
<script src="tema3.js"></script>
<script src="tema4.js"></script>
<script src="tema5.js"></script>
<script src="tema6.js"></script>




  <style>
    :root {
      --duo-green: #58cc02;
      --duo-green-dark: #46a302;
      --duo-blue: #1cb0f6;
      --duo-blue-dark: #1899d6;
      --duo-orange: #ff9600;
      --duo-orange-dark: #e08400;
      --duo-purple: #ce82ff;
      --duo-purple-dark: #b060e0;
      --duo-red: #ff4b4b;
      --duo-red-dark: #ea2b2b;
      --duo-yellow: #ffc800;
      --duo-yellow-dark: #e0b000;
      --duo-card-border: #e2e8f0;
      --bg-dots: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      background-image: radial-gradient(var(--bg-dots) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      padding: 2rem 1rem;
    }

    h1, h2, h3, h4, h5, .font-display {
      font-family: 'Fredoka', sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .duo-card {
      border: 3px solid var(--duo-card-border);
      border-bottom: 6px solid var(--duo-card-border);
      border-radius: 20px;
      background-color: #ffffff;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .header-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom-color: var(--duo-green-dark);
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .header-icon {
      width: 64px;
      height: 64px;
      background-color: var(--duo-green);
      color: white;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      border: 2px solid rgba(0,0,0,0.1);
      box-shadow: 0 5px 0 0 var(--duo-green-dark);
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      font-family: 'Fredoka', sans-serif;
    }

    .badge-green { background-color: #d7ffb8; color: #3b7a00; border: 1px solid #a3e635; }
    .badge-orange { background-color: #ffedd5; color: #c2410c; border: 1px solid #fed7aa; }
    .badge-blue { background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }

    .duo-btn {
      width: 100%;
      background-color: var(--duo-green);
      color: white;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.125rem;
      font-weight: 700;
      padding: 1rem;
      border-radius: 16px;
      border: 2px solid rgba(0,0,0,0.1);
      box-shadow: 0 5px 0 0 var(--duo-green-dark);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      transition: all 0.2s ease;
    }

    .duo-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 0 var(--duo-green-dark);
    }

    .duo-btn.loading {
      background-color: var(--duo-blue);
      box-shadow: 0 5px 0 0 var(--duo-blue-dark);
      cursor: wait;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .spinner {
      animation: spin 1s linear infinite;
    }

    /* ESTILOS ESPECÍFICOS PARA EL RENDERIZADO DEL PDF EN A4 */
    .pdf-render-root {
      background: white;
      font-family: 'Outfit', sans-serif;
      width: 190mm;
      padding: 0;
      box-sizing: border-box;
      position: relative;
    }

    /* TARJETAS DINÁMICAS EN PDF CON BREAK-INSIDE AVOID */
    .pdf-render-root .duo-card {
      break-inside: avoid !important;
      page-break-inside: avoid !important;
      margin-bottom: 15px !important;
    }

    .pdf-cover-block {
      page-break-after: always !important;
      break-after: page !important;
      height: 260mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      margin-bottom: 0 !important;
    }

    .pdf-watermark-fixed {
      position: fixed;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-family: 'Fredoka', sans-serif;
      font-size: 3rem;
      font-weight: 700;
      color: rgba(148, 163, 184, 0.12);
      white-space: nowrap;
      pointer-events: none;
      z-index: 9999;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 0.75rem;
    }

    .callout-box {
      border-radius: 16px;
      padding: 0.85rem;
      background-color: #f8fafc;
      border: 2px solid var(--duo-card-border);
      border-left-width: 6px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .callout-orange { border-left-color: var(--duo-orange); background-color: #fff7ed; }
    .callout-blue { border-left-color: var(--duo-blue); background-color: #f0f9ff; }
    .callout-purple { border-left-color: var(--duo-purple); background-color: #faf5ff; }

    .flowchart-container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .flow-node {
      flex: 1;
      background-color: #f8fafc;
      border: 2px solid var(--duo-card-border);
      border-radius: 14px;
      padding: 0.75rem;
      text-align: center;
      break-inside: avoid;
    }

    .flow-arrow {
      color: var(--duo-purple);
      font-size: 1.25rem;
    }

    .timeline-list {
      position: relative;
      padding-left: 2rem;
      border-left: 4px solid #cbd5e1;
      margin-left: 1rem;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 0.85rem;
      break-inside: avoid !important;
      page-break-inside: avoid !important;
    }

    .timeline-node {
      position: absolute;
      left: -2.85rem;
      top: 0;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background-color: var(--duo-blue);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid white;
      font-size: 0.85rem;
    }

    .text-highlight {
      background-color: #fef08a;
      padding: 0.1rem 0.4rem;
      border-radius: 6px;
      font-weight: 800;
      color: #854d0e;
    }

    .bold-green { color: var(--duo-green-dark); font-weight: 800; }
    .bold-blue { color: var(--duo-blue-dark); font-weight: 800; }
    .bold-purple { color: var(--duo-purple-dark); font-weight: 800; }
    .bold-red { color: var(--duo-red-dark); font-weight: 800; }

    .pdf-footer-item {
      text-align: center;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      border-top: 2px solid #e2e8f0;
      padding-top: 8px;
      margin-top: 1.5rem;
      break-inside: avoid;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <div class="duo-card header-card">
      <div class="header-info">
        <div class="header-icon">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <h1 class="font-display" style="font-size: 1.875rem;">Història<span style="color: var(--duo-green);">Lab</span> Notes</h1>
            <span id="proBadge" class="badge badge-green">Apunts PDF</span>
          </div>
          <p style="color: #64748b; font-weight: 600; font-size: 0.875rem;">Generador Directe d'Apunts i Esquemes Integrals</p>
        </div>
      </div>
    </div>

    <div class="duo-card" style="border-bottom-color: var(--duo-blue-dark);">
      <h2 class="font-display" style="font-size: 1.5rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.75rem;">
        <i class="fa-solid fa-folder-open" style="color: var(--duo-blue);"></i>
        Temari Disponible
      </h2>
      <div id="topicsList"></div>
    </div>

    <footer style="text-align: center; padding: 1.5rem 0; color: #94a3b8; font-family: 'Fredoka', sans-serif; font-size: 0.875rem; font-weight: 700;">
      © <span id="currentYear"></span> HistoriaLab & HistoriaLab Notes
    </footer>

    <!-- CONTENEDOR TEMPORAL DE RENDERIZADO DENTRO DEL BODY (AFUERA DE FLUJOS EXTRAÑOS) -->
    <div id="pdfRenderContainer" class="hidden"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isPro = urlParams.get('pro') === 'true';

    const yearStr = new Date().getFullYear();
    document.getElementById('currentYear').textContent = yearStr;

    if (isPro) {
      const proBadge = document.getElementById('proBadge');
      proBadge.style.backgroundColor = '#fef3c7';
      proBadge.style.color = '#b45309';
      proBadge.style.border = '1px solid #fde68a';
      proBadge.innerHTML = '<i class="fa-solid fa-crown" style="color: #d97706; margin-right: 4px;"></i> USUARI PRO';
    }

    window.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('topicsList');
      const loadedTopics = window.HISTORIALAB_TEMES || [];

      if (loadedTopics.length === 0) {
        container.innerHTML = `<p style="color: #94a3b8; font-weight: 700; text-align: center;">No s'han trobat arxius .js de temes carregats.</p>`;
        return;
      }

      container.innerHTML = loadedTopics.map(tema => `
        <div class="duo-card" style="margin-bottom: 1rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
            <span class="badge badge-green">Unitat ${tema.unitNum}</span>
            <span class="badge badge-orange"><i class="fa-solid fa-bolt"></i> +${tema.xp || 500} XP</span>
          </div>
          <h3 class="font-display" style="font-size: 1.25rem; margin-bottom: 0.5rem;">${tema.title}</h3>
          <p style="color: #64748b; font-size: 0.875rem; font-weight: 600; margin-bottom: 1.25rem;">${tema.subtitle}</p>
          <button id="btn-${tema.id}" class="duo-btn" onclick="generatePDF('${tema.id}')">
            <i class="fa-solid fa-file-pdf" style="font-size: 1.25rem;"></i>
            <span>Descarregar Apunts Complets (.pdf)</span>
          </button>
        </div>
      `).join('');
    });

    function renderSectionHTML(sec) {
      if (sec.type === 'callouts') {
        return `
          <div class="duo-card">
            <h2 class="font-display" style="font-size: 1.15rem; margin-bottom: 0.85rem; color: #1e293b;">${sec.title}</h2>
            <div class="grid-3">
              ${sec.items.map(item => `
                <div class="callout-box callout-${item.color}">
                  <div class="font-display" style="font-size: 0.85rem; margin-bottom: 0.35rem; color: #0f172a;">
                    <i class="fa-solid ${item.icon}"></i> ${item.header}
                  </div>
                  <p style="font-size: 0.725rem; font-weight: 600; color: #334155;">${item.content}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (sec.type === 'textBlock') {
        return `
          <div class="duo-card" style="border-bottom-color: var(--duo-blue-dark);">
            <h2 class="font-display" style="font-size: 1.15rem; margin-bottom: 0.65rem; color: #1e293b;">${sec.title}</h2>
            <div style="font-size: 0.825rem; font-weight: 600; line-height: 1.55; color: #334155;">
              ${sec.content}
            </div>
          </div>
        `;
      } else if (sec.type === 'flowchart') {
        let html = `
          <div class="duo-card" style="border-bottom-color: var(--duo-purple-dark);">
            <h2 class="font-display" style="font-size: 1.15rem; margin-bottom: 0.85rem; color: #1e293b;">${sec.title}</h2>
        `;
        if (!isPro) {
          html += `
            <div style="background-color: #faf5ff; border: 2px dashed var(--duo-purple); border-radius: 16px; padding: 1.25rem; text-align: center;">
              <div style="width: 42px; height: 42px; background-color: #f3e8ff; color: var(--duo-purple); border-radius: 12px; margin: 0 auto 0.5rem; display: flex; align-items: center; justify-content: center; font-size: 1.25rem;">
                <i class="fa-solid fa-lock"></i>
              </div>
              <h4 class="font-display" style="font-size: 1rem; color: #581c87; margin-bottom: 0.2rem;">Diagrames i Flowcharts Bloquejats</h4>
              <p style="font-size: 0.725rem; color: #7e22ce; font-weight: 600;">Accedeix a la versió <strong>PRO</strong> per desblocar els diagrames integrats en el PDF.</p>
            </div>
          `;
        } else {
          html += `
            <div class="flowchart-container">
              ${sec.steps.map((step, idx) => `
                <div class="flow-node">
                  <span class="badge badge-orange" style="font-size: 0.6rem; margin-bottom: 0.2rem;">${step.badge}</span>
                  <h4 class="font-display" style="font-size: 0.825rem; margin-top: 0.2rem;">${step.label}</h4>
                  <p style="font-size: 0.675rem; color: #64748b; font-weight: 600;">${step.desc}</p>
                </div>
                ${idx < sec.steps.length - 1 ? `<div class="flow-arrow"><i class="fa-solid fa-arrow-right"></i></div>` : ''}
              `).join('')}
            </div>
          `;
        }
        html += `</div>`;
        return html;
      } else if (sec.type === 'matrix') {
        return `
          <div class="duo-card" style="border-bottom-color: var(--duo-orange-dark);">
            <h2 class="font-display" style="font-size: 1.15rem; margin-bottom: 0.85rem; color: #1e293b;">${sec.title}</h2>
            <div class="grid-2">
              ${sec.quadrants.map(q => `
                <div style="border: 2px solid var(--duo-card-border); border-radius: 14px; padding: 0.85rem; background-color: #f8fafc; break-inside: avoid;">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
                    <h4 class="font-display" style="font-size: 0.875rem;">${q.title}</h4>
                    <span class="badge badge-blue" style="font-size: 0.6rem;">${q.badge}</span>
                  </div>
                  <ul style="font-size: 0.725rem; font-weight: 600; color: #475569; padding-left: 0.85rem;">
                    ${q.points.map(pt => `<li style="margin-bottom: 0.2rem;">${pt}</li>`).join('')}
                  </ul>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (sec.type === 'timeline') {
        return `
          <div class="duo-card" style="border-bottom-color: var(--duo-green-dark);">
            <h2 class="font-display" style="font-size: 1.15rem; margin-bottom: 1rem; color: #1e293b;">${sec.title}</h2>
            <div class="timeline-list">
              ${sec.events.map(ev => `
                <div class="timeline-item">
                  <div class="timeline-node"><i class="fa-solid ${ev.icon}"></i></div>
                  <div style="background: #f8fafc; border: 2px solid var(--duo-card-border); border-radius: 12px; padding: 0.65rem 0.85rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.2rem;">
                      <span class="font-display" style="color: var(--duo-blue); font-size: 0.9rem;">${ev.year}</span>
                      <span class="badge badge-blue" style="font-size: 0.6rem;">${ev.badge}</span>
                    </div>
                    <h4 class="font-display" style="font-size: 0.825rem;">${ev.event}</h4>
                    <p style="font-size: 0.725rem; color: #475569; font-weight: 600;">${ev.desc}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (sec.type === 'sources') {
        return `
          <div class="duo-card" style="background-color: #fffbeb; border-bottom-color: var(--duo-yellow-dark);">
            <div style="font-family: 'Fredoka', sans-serif; font-size: 0.825rem; color: #b45309; text-transform: uppercase; margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.4rem;">
              <i class="fa-solid fa-quote-left" style="font-size: 1.1rem;"></i> ${sec.quoteTitle}
            </div>
            <blockquote style="font-style: italic; font-size: 0.725rem; color: #1e293b; border-left: 3px solid var(--duo-yellow); padding-left: 0.5rem; margin-bottom: 0.35rem;">
              «${sec.quoteText}»
            </blockquote>
            <div style="text-align: right; font-size: 0.675rem; font-weight: 800; color: #92400e;">— ${sec.quoteAuthor}</div>
          </div>
        `;
      } else if (sec.type === 'character') {
        return `
          <div class="duo-card" style="border-bottom-color: var(--duo-purple-dark);">
            <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.4rem;">
              <div style="width: 38px; height: 38px; border-radius: 10px; background: #faf5ff; color: var(--duo-purple); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; border: 2px solid #e9d5ff;">
                <i class="fa-solid ${sec.icon || 'fa-user-astronaut'}"></i>
              </div>
              <div>
                <h4 class="font-display" style="font-size: 0.875rem;">${sec.charName}</h4>
                <span class="badge" style="background: #faf5ff; color: var(--duo-purple-dark); border: 1px solid #e9d5ff; font-size: 0.575rem;">${sec.charRole}</span>
              </div>
            </div>
            <p style="font-size: 0.725rem; color: #475569; font-weight: 600;">${sec.charDesc}</p>
          </div>
        `;
      }
      return '';
    }

    function generatePDF(temaId) {
      const tema = (window.HISTORIALAB_TEMES || []).find(t => t.id === temaId);
      if (!tema) return alert("Tema no trobat.");

      const btn = document.getElementById(`btn-${temaId}`);
      if (btn) {
        btn.classList.add('loading');
        btn.innerHTML = `<i class="fa-solid fa-spinner spinner" style="font-size: 1.25rem;"></i><span>Generant Apunts PDF...</span>`;
      }

      const renderContainer = document.getElementById('pdfRenderContainer');
      renderContainer.classList.remove('hidden');

      const coverBg = tema.coverGradient || 'linear-gradient(135deg, #58cc02, #059669)';

      let fullContentHtml = `
        <div class="pdf-render-root">
          ${!isPro ? `<div class="pdf-watermark-fixed">HistòriaLab Notes FREE</div>` : ''}
          
          <!-- PORTADA COMPLETA EN LA PÁGINA 1 CON LOGO ABAJO -->
          <div class="pdf-cover-block">
            <div style="background: ${coverBg}; color: white; border-radius: 24px; padding: 3.5rem 2rem; text-align: center; border: 4px solid #0002; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
              
              <div>
                <div style="width: 80px; height: 80px; background: rgba(255,255,255,0.2); border-radius: 20px; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; font-size: 2.5rem;">
                  <i class="fa-solid ${tema.icon || 'fa-book'}"></i>
                </div>
                <span style="background: rgba(255,255,255,0.25); padding: 0.35rem 1rem; border-radius: 99px; font-size: 0.85rem; font-weight: 800; font-family: 'Fredoka', sans-serif; letter-spacing: 1px;">UNITAT ${tema.unitNum}</span>
                <h1 style="font-family: 'Fredoka', sans-serif; font-size: 2.5rem; margin: 1.25rem 0 0.75rem; line-height: 1.2;">${tema.title}</h1>
                <p style="font-size: 1.1rem; opacity: 0.95; font-weight: 600; max-width: 500px; margin: 0 auto;">${tema.subtitle}</p>
              </div>

              <!-- LOGO MEDIANO DE HISTORIALAB NOTES -->
              <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 2px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; gap: 0.75rem;">
                <div style="width: 42px; height: 42px; background: rgba(255,255,255,0.25); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem;">
                  <i class="fa-solid fa-book-open"></i>
                </div>
                <span style="font-family: 'Fredoka', sans-serif; font-size: 1.35rem; font-weight: 700; letter-spacing: 0.5px;">HistòriaLab Notes</span>
              </div>

            </div>
          </div>

          <!-- CONTENIDOS RESPETANDO EL ORDEN EXACTO DEL JS -->
          ${tema.sections.map(sec => renderSectionHTML(sec)).join('')}

          <div class="pdf-footer-item">
            © ${yearStr} HistoriaLab & HistoriaLab Notes
          </div>
        </div>
      `;

      renderContainer.innerHTML = fullContentHtml;

      // CONFIGURACIÓN DINÁMICA ULTRAESTABLE CON HTML2PDF
      const opt = {
        margin: [10, 10, 12, 10],
        filename: `${tema.id}_apunts_historialab.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, logging: false, scrollX: 0, scrollY: 0 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
      };

      html2pdf().set(opt).from(renderContainer).save().then(() => {
        renderContainer.classList.add('hidden');
        if (btn) {
          btn.classList.remove('loading');
          btn.innerHTML = `<i class="fa-solid fa-check" style="font-size: 1.25rem;"></i><span>¡PDF Descarregat!</span>`;
          setTimeout(() => {
            btn.innerHTML = `<i class="fa-solid fa-file-pdf" style="font-size: 1.25rem;"></i><span>Descarregar Apunts Complets (.pdf)</span>`;
          }, 3000);
        }
      }).catch(err => {
        console.error("Error al generar PDF:", err);
        alert("S'ha produït un error al generar el PDF.");
        if (btn) {
          btn.classList.remove('loading');
          btn.innerHTML = `<i class="fa-solid fa-file-pdf" style="font-size: 1.25rem;"></i><span>Descarregar Apunts Complets (.pdf)</span>`;
        }
      });
    }
  </script>
</body>
</html>
